name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  MIX_ENV: test

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18.4"

      - name: Restore deps and _build cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Run tests
        run: mix test

      - name: Audit retired Hex packages
        run: mix hex.audit

      - name: Audit dependencies for known vulnerabilities
        run: mix deps.audit

  # Hands the emitted Kotlin to a real Kotlin compiler, then runs it against real
  # Rpc.Runner responses. Every "generated code does not compile" defect so far
  # (#20, #23, #30, #33, #44, #45) was found by a human reading strings, and the
  # compile step is the machine that should have found them.
  #
  # Compiling is not enough on its own: #24, #51 and #54 all compiled and then
  # threw or silently read null, because kotlinc has no opinion about whether a
  # @SerialName matches the key the server sends. That is what the decode step
  # measures (#58).
  #
  # The job id and its display name are unchanged on purpose, so a branch
  # protection rule naming the required check keeps matching.
  kotlin-compile-gate:
    name: Compile the generated Kotlin
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18.4"

      # Restore-only: the `test` job owns writing this key, and both jobs run in
      # parallel off the same mix.lock.
      - name: Restore deps and _build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      # MIX_ENV=test is what puts AshKotlinMultiplatform.Test.Domain into
      # :ash_domains (config/config.exs), so it is what gives the generator any
      # resources to emit at all.
      - name: Generate the Kotlin fixture sources
        run: MIX_ENV=test mix ash_kotlin_multiplatform.gen_kotlin_fixture

      # Real responses, produced by running the actions rather than describing
      # them. The decode step below reads this file.
      - name: Generate the round-trip response fixture
        run: MIX_ENV=test mix ash_kotlin_multiplatform.gen_roundtrip_fixture

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # Installs Gradle and caches ~/.gradle, so the Maven Central downloads for
      # kotlinx/ktor are paid for once rather than on every run.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.7.0"

      - name: Compile the generated Kotlin
        working-directory: test/fixtures/kotlin_compile
        run: gradle compileKotlin --console=plain

      # Decodes every fixture response with the generated class meant to read it
      # and exits non-zero on any throw or wrong value. Runs both
      # :datetime_library subprojects.
      - name: Decode real responses with the generated Kotlin
        working-directory: test/fixtures/kotlin_compile
        run: gradle run --console=plain
